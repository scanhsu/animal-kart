<!DOCTYPE html>

<title>動物屁屁大賽車</title>

<style>
/* VOICE: 吵鬧、可愛、卡通，像兒童節目裡的賽車
   IDEA: 遊樂園賽車機台的塑膠外殼與記分板
   PICTURE: 3D 賽道本身；選角時鏡頭繞著角色轉
   COLOUR and TYPE: 天空藍、草地綠、糖果粉，大便棕當強調；Baloo 2 粗圓字加粗描邊
   LAYOUT: 全螢幕遊戲，HUD 在四角，觸控鍵在下緣兩側 */
:root{color-scheme:light;--pink:#ff4f8b;--ink:#2b1a10;--cream:#fff8ec;--sun:#ffd166}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:"Baloo 2","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.pad{padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.hud{position:fixed;inset:0;pointer-events:none}
.stroke{color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#tl{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
#pos{font-size:58px;font-weight:800;line-height:.95}
#pos small{font-size:24px}
.chip{display:inline-block;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:1px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
#mini{display:block;width:118px;height:118px;margin-top:10px;background:rgba(255,248,236,.72);border:3px solid var(--ink);border-radius:18px}
#tr{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px}
#slot{width:92px;height:92px;border-radius:26px;background:var(--cream);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;font-size:46px;line-height:1}
#slot.roll{background:var(--sun)}
#slotName{font-size:14px}
#mute{pointer-events:auto;font:inherit;cursor:pointer;min-height:36px}
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,0) scale(.6);opacity:0;font-size:clamp(26px,6vw,44px);font-weight:800;white-space:nowrap;transition:.18s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#count{position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(90px,24vw,190px);font-weight:800;pointer-events:none;opacity:0}
#count.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:scale(2)}40%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
#splat{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s}
#splat.on{opacity:1;transition:opacity .05s}
#splat i{position:absolute;border-radius:52% 46% 58% 40%/48% 55% 45% 52%;background:radial-gradient(circle at 34% 30%,#b07a42,#6b3f17 55%,#43260c);box-shadow:inset -6px -8px 0 rgba(0,0,0,.18)}
#splat i::after{content:"";position:absolute;left:40%;top:80%;width:18%;height:60%;border-radius:0 0 50% 50%;background:#5a3412}
#splat b{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:clamp(34px,9vw,70px)}
#gas{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(160,215,60,.15),rgba(120,190,40,.55));opacity:0;transition:opacity 1.2s}
#gas.on{opacity:1;transition:opacity .05s}
#rage{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,60,40,0) 40%,rgba(220,20,10,.55));opacity:0;transition:opacity .6s}
#rage.on{opacity:1;animation:pulse .25s infinite alternate}
@keyframes pulse{to{opacity:.6}}
#mom{position:fixed;left:50%;top:max(6%,env(safe-area-inset-top));width:min(62vw,300px);transform:translate(-50%,-140%);transition:transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;text-align:center}
#mom.on{transform:translate(-50%,0)}
#mom.on svg{animation:yell .12s infinite alternate}
@keyframes yell{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.04)}}
#mom svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 0 #2b1a10)}
#momSay{display:inline-block;margin-top:-6px;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:4px 16px;font-size:clamp(22px,6vw,38px);font-weight:800;line-height:1.15;color:#e8413c;box-shadow:0 5px 0 var(--ink);max-width:92vw;text-wrap:balance}
@media (prefers-reduced-motion:reduce){#mom.on svg,#rage.on{animation:none}}
#tc{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#tc .g{display:flex;gap:12px;align-items:flex-end}
.tb{pointer-events:auto;width:80px;height:80px;border-radius:50%;border:4px solid var(--ink);background:rgba(255,248,236,.85);font:inherit;font-size:30px;font-weight:800;box-shadow:0 5px 0 var(--ink);color:var(--ink);touch-action:none;padding:0}
.tb.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--sun)}
#bItem{width:100px;height:100px;background:var(--sun);font-size:22px}
#bBrake{font-size:18px}
#joyHint{transition:opacity .4s}#joyHint.fade{opacity:0}
#joy{position:fixed;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:4px solid rgba(43,26,16,.55);background:rgba(255,248,236,.28);pointer-events:none;display:none}
#joy.on{display:block}
#joy::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:rgba(43,26,16,.25)}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--sun);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;pointer-events:none}
.ov h1{margin:6px 0 0;font-size:clamp(36px,8.5vw,68px);line-height:1.05;text-align:center;-webkit-text-stroke-width:4px;text-shadow:0 6px 0 var(--ink);text-wrap:balance}
.ov .sub{font-weight:800;font-size:16px;text-align:center;margin-top:4px}
.panel{pointer-events:auto;background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:16px;width:min(760px,100%)}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media(max-width:600px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:12px;border-radius:22px}}
.card{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:8px 4px 6px;font:inherit;font-weight:800;font-size:14px;line-height:1.2;min-height:44px;cursor:pointer;color:var(--ink)}
.card .dot{display:block;width:32px;height:32px;border-radius:50%;margin:0 auto 4px;border:3px solid var(--ink)}
.card[aria-pressed=true]{background:var(--sun);transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px;font-size:14px;line-height:1.35;margin:12px 0}
.items span b{font-size:18px;margin-right:4px}
.hint{font-size:13px;margin:0 0 10px;opacity:.8}
.go{display:block;width:100%;font:inherit;font-size:26px;font-weight:800;padding:8px;border:4px solid var(--ink);border-radius:18px;background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--ink);cursor:pointer;min-height:56px}
.go.alt{background:#fff;color:var(--ink);font-size:20px}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
button:focus-visible{outline:4px solid #2f80ed;outline-offset:2px}
#err{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:99;background:#e8413c;text-align:center;color:#fff;font-weight:800;padding:10px 14px;border-radius:14px;border:3px solid var(--ink);font-size:15px}
#err.ok{background:var(--cream);color:var(--ink)}
#sel{justify-content:safe center;gap:clamp(12px,3vh,28px);padding-bottom:max(48px,calc(env(safe-area-inset-bottom) + 36px))}
#sel,#res{pointer-events:auto;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#res{justify-content:safe center}
#help summary{cursor:pointer;font-weight:800;font-size:15px;min-height:36px;display:flex;align-items:center;margin-top:8px}
@media (max-height:560px) and (orientation:landscape){
  .ov h1{font-size:30px;-webkit-text-stroke-width:3px;text-shadow:0 3px 0 var(--ink);margin:0}
  .ov .sub{display:none}
  #sel .panel{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px 14px;align-items:stretch;padding:10px;width:min(880px,100%);border-radius:20px}
  #sel .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  #sel .card{padding:4px 2px;font-size:13px}#sel .card .dot{width:22px;height:22px;margin-bottom:2px}
  #start{grid-column:2;grid-row:1;height:100%}
  #help{grid-column:1/-1}#help summary{margin-top:0}
  #res h2{font-size:22px;margin-bottom:6px}#resList li{padding:2px 10px;font-size:15px}#resList{margin-bottom:8px}
  .go{min-height:48px;font-size:22px}}
#res .panel{width:min(460px,100%)}
#res h2{margin:0 0 10px;font-size:30px;line-height:1.1;text-align:center;text-wrap:balance}
#resList{list-style:none;margin:0 0 14px;padding:0}
#resList li{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;font-weight:800;font-size:17px}
#resList li:nth-child(odd){background:rgba(43,26,16,.06)}
#resList li.me{background:var(--sun)}
#resList em{font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion:reduce){#count.pop{animation-duration:.01s}#toast{transition:none}}
</style></head><body>

<script>
window.boot=function(){if(window.__booted)return;window.__booted=1;try{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const touchMode=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
const LAPS=3;

/* ---------- renderer ---------- */
const glTest=document.createElement('canvas');
if(!(glTest.getContext('webgl')||glTest.getContext('experimental-webgl'))){window.__fail('這台裝置的瀏覽器無法開啟 3D 畫面（WebGL）。如果 iPad 有開「鎖定模式」，請在 Safari 把這個網站排除後再試。');return;}
const renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const SKY=0x8fd3ff;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,220,760);
const camera=new THREE.PerspectiveCamera(70,1,0.5,1600);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a9a3a,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(80,150,60);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const matCache={};
const M=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c}));
const SPH=new THREE.SphereGeometry(1,16,12);
function sph(c,r,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(SPH,M(c));m.position.set(x,y,z);m.scale.set(r*sx,r*sy,r*sz);return m;}
function cone(c,r,h,x,y,z,rx=0,rz=0){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,10),M(c));m.position.set(x,y,z);m.rotation.set(rx,0,rz);return m;}
function cyl(c,r,h,x,y,z,rx=0,rz=0){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,10),M(c));m.position.set(x,y,z);m.rotation.set(rx,0,rz);return m;}
function box(c,w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);return m;}

/* ---------- track ---------- */
const CP=[[0,0],[110,-15],[190,20],[215,100],[175,165],[100,150],[50,200],[-30,225],[-110,190],[-150,110],[-120,40],[-60,5]];
const curve=new THREE.CatmullRomCurve3(CP.map(([x,z])=>new THREE.Vector3(x*1.5,0,z*1.5)),true,'centripetal');
const N=600,W=10,P=[],T=[],NR=[];
const spts=curve.getSpacedPoints(N);
for(let i=0;i<N;i++){const a=spts[i],b=spts[i+1];let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;P.push({x:a.x,z:a.z});T.push({x:tx,z:tz});NR.push({x:-tz,z:tx});}
let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;for(const p of P){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z);}
const CX=(minX+maxX)/2,CZ=(minZ+maxZ)/2;

/* zones along the lap: 0..1 of the lap */
const ZONES=[['grass',0,0.2],['sand',0.2,0.42],['grass',0.42,0.5],['mud',0.5,0.61],['grass',0.61,0.64],['ice',0.64,0.86],['grass',0.86,1.01]];
const ZI=new Array(N).fill('grass');for(let i=0;i<N;i++){const f=i/N;for(const z of ZONES)if(f>=z[1]&&f<z[2])ZI[i]=z[0];}
const ZNAME={grass:'草原區',sand:'沙漠區：沙地會變慢',mud:'泥巴區：小心水坑',ice:'冰雪區：轉彎會打滑！'};
function strip(w0,w1,y,colorFn){const pos=[],col=[],idx=[],c=new THREE.Color();
  for(let i=0;i<N;i++){const j=(i+1)%N,base=pos.length/3;
    const cc=colorFn(i);if(cc==null)continue;
    for(const [k,w] of [[i,w0],[i,w1],[j,w0],[j,w1]]){pos.push(P[k].x+NR[k].x*w,y,P[k].z+NR[k].z*w);c.set(cc);col.push(c.r,c.g,c.b);}

  let max=off?(zn==='sand'?17:zn==='ice'?26:24):(zn==='sand'?46:55);if(inMud)max=Math.min(max,22);if(!k.isPlayer)max*=k.skill*rubber(k);if(k.slowT>0)max*=0.5;

  if(k.y>0||k.vy!==0){k.vy-=30*dt;k.y+=k.vy*dt;if(k.y<=0){k.y=0;k.vy=0;}}
  const old=k.idx;k.idx=nearest(k.x,k.z,k.idx);
  if(old>N*0.8&&k.idx<N*0.2)onLap(k);else if(old<N*0.2&&k.idx>N*0.8)k.lap--;
  const p2=P[k.idx],n2=NR[k.idx],l2=(k.x-p2.x)*n2.x+(k.z-p2.z)*n2.z,lim=W+22;
  if(Math.abs(l2)>lim){const d=l2-Math.sign(l2)*lim;k.x-=n2.x*d;k.z-=n2.z*d;k.speed*=0.9;}
  k.prog=k.lap*N+k.idx;
  if(k.fartT>0){k.puffT-=dt;if(k.puffT<=0){k.puffT=0.07;spawnGas(k.x-Math.sin(k.h)*3.2+(Math.random()-.5),k.z-Math.cos(k.h)*3.2,k,1.1+Math.random()*0.8,3.5);}}
  for(const b of boxes){if(b.t>0)continue;const dx=k.x-b.x,dz=k.z-b.z;if(dx*dx+dz*dz<12&&k.y<2){b.t=2.5;b.m.visible=false;if(!k.item&&!(k.rolling>0))giveItem(k);}}
  k.root.position.set(k.x,0,k.z);k.root.rotation.y=k.h;k.model.rotation.y=k.spinA+clamp(wrapA(k.h-k.mv),-0.5,0.5)*0.6;k.model.position.x=k.stunT>0?Math.sin(clock*70)*0.18:0;
  k.model.position.y=k.y+(k.fartT>0?Math.abs(Math.sin(clock*25))*0.4:0);
  k.model.rotation.z=-st*0.09*Math.min(1,Math.abs(k.speed)/30);
  k.head.rotation.y=-st*0.35+(k.slowT>0?Math.sin(clock*9)*0.4:0);
  k.hat.visible=k.hatT>0;
  k.bubble.visible=k.immT>0;if(k.immT>0){k.bubble.material.color.setHSL((clock*1.5)%1,0.9,0.6);k.bubble.material.opacity=k.immT<0.8&&Math.sin(clock*30)>0?0.1:0.35;
    k.head.rotation.z=Math.sin(clock*14)*0.35;k.head.rotation.x=Math.sin(clock*9)*0.2;}else{k.head.rotation.z=0;k.head.rotation.x=0;}}

function collide(){for(let i=0;i<karts.length;i++)for(let j=i+1;j<karts.length;j++){const a=karts[i],b=karts[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
  if(d<3.4&&d>0.001){const q=(3.4-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*q;a.z-=nz*q;b.x+=nx*q;b.z+=nz*q;}}}
function updHazards(dt){
  for(let i=hz.length-1;i>=0;i--){const h=hz[i];h.age+=dt;h.life-=dt;
    if(h.type==='poke'){const tg=h.tg,dx=tg.x-h.x,dz=tg.z-h.z,d=Math.hypot(dx,dz);h.sp=Math.min(150,h.sp+60*dt);
      if(d<3.2){hitKart(tg,'poke',h.owner);scene.remove(h.mesh);hz.splice(i,1);continue;}
      const st=Math.min(d,h.sp*dt);h.x+=dx/d*st;h.z+=dz/d*st;h.y+=((d<20?tg.y+1.5:5)-h.y)*Math.min(1,dt*4);h.mesh.rotation.y=Math.atan2(dx,dz);
      h.mesh.position.set(h.x,h.y,h.z);if(h.life<=0){scene.remove(h.mesh);hz.splice(i,1);}continue;}
    if(h.type==='poop'){
      if(h.home){const sp=Math.hypot(h.vx,h.vz);let best=null,bd=60;
        for(const k of karts){if(k===h.owner)continue;const dx=k.x-h.x,dz=k.z-h.z,d=Math.hypot(dx,dz);if(d<bd&&(dx*h.vx+dz*h.vz)/(d*sp)>0.8){bd=d;best=k;}}
        if(best){const dx=best.x-h.x,dz=best.z-h.z,d=Math.hypot(dx,dz),f=Math.min(1,dt*3);h.vx+=(dx/d*sp-h.vx)*f;h.vz+=(dz/d*sp-h.vz)*f;}}
      h.x+=h.vx*dt;h.z+=h.vz*dt;h.vy-=18*dt;h.y+=h.vy*dt;if(h.y<0.3){h.y=0.3;h.vy=Math.abs(h.vy)*0.45;}h.mesh.rotation.y+=dt*10;
      if(h.life<=0){h.type='ground';h.life=25;h.y=0;h.mesh.rotation.set(0,Math.random()*6,0);h.mesh.scale.setScalar(1.15);}}
    else if(h.type==='gas'){const s=h.size*(1+h.age*0.6);h.mesh.scale.setScalar(s);h.mesh.material.opacity=Math.max(0,0.5*h.life/h.maxLife);h.y+=dt*0.8;h.r=s*1.1;}
    h.mesh.position.set(h.x,h.y,h.z);
    let gone=h.life<=0;
    if(!gone&&state!=='countdown')for(const k of karts){
      if(k===h.owner&&(h.type==='gas'||h.type==='poop'||h.age<0.6))continue;
      const dx=k.x-h.x,dz=k.z-h.z;if(dx*dx+dz*dz<(h.r+1.4)**2){if(h.type==='gas')hitKart(k,'gas',h.owner);else{hitKart(k,h.type,h.owner);gone=true;break;}}}
    if(gone){scene.remove(h.mesh);if(h.own)h.mesh.material.dispose();hz.splice(i,1);}}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const u=f.t/f.dur;f.m.scale.setScalar(1+u*29);f.m.material.opacity=0.7*(1-u);if(u>=1){scene.remove(f.m);f.m.material.dispose();fx.splice(i,1);}}}
function order(){return karts.slice().sort((a,b)=>(b.finished-a.finished)||(a.finished&&b.finished?a.ft-b.ft:b.prog-a.prog));}

/* ---------- HUD ---------- */
const fmt=s=>`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;
let toastTO;function toast(s){const el=$('#toast');el.textContent=s;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(toastTO);toastTO=setTimeout(()=>el.classList.remove('show'),1500);}
function showCount(s){const el=$('#count');el.textContent=s;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
const flashTO={};function flash(sel){const el=$(sel);el.classList.add('on');clearTimeout(flashTO[sel]);flashTO[sel]=setTimeout(()=>el.classList.remove('on'),1400);}
function splat(){const el=$('#splat');el.innerHTML='';for(let i=0;i<9;i++){const d=document.createElement('i');const s=12+Math.random()*26;
  d.style.cssText=`width:${s}vmin;height:${s*0.85}vmin;left:${Math.random()*85}%;top:${Math.random()*70}%;transform:rotate(${Math.random()*360}deg)`;el.appendChild(d);}
  const b=document.createElement('b');b.className='stroke';b.textContent='噁～～！';el.appendChild(b);flash('#splat');clearTimeout(flashTO['#splat']);flashTO['#splat']=setTimeout(()=>el.classList.remove('on'),2600);}
const mini=$('#mini'),mx=mini.getContext('2d'),MS=236,mScale=(MS-28)/Math.max(maxX-minX,maxZ-minZ);
const mp=(x,z)=>[MS/2-(x-CX)*mScale,MS/2-(z-CZ)*mScale];
const hudCache={};function setText(id,v,html){if(hudCache[id]===v)return;hudCache[id]=v;$('#'+id)[html?'innerHTML':'textContent']=v;}
function hud(){if(!player)return;
  setText('pos',`${player.rank+1}<small>/${karts.length}</small>`,true);
  setText('lap',`第 ${clamp(player.lap,1,LAPS)} / ${LAPS} 圈`);setText('time',fmt(raceT));
  const slot=$('#slot');
  if(player.rolling>0){slot.classList.add('roll');setText('slot',ICONS[Math.floor(clock*14)%ICONS.length]);setText('slotName','抽道具中…');}
  else{slot.classList.remove('roll');const it=player.item?ITEMS[player.item]:null;setText('slot',it?it[0]:'');setText('slotName',it?it[1]:'沒有道具');}
  mx.clearRect(0,0,MS,MS);mx.lineJoin='round';mx.beginPath();for(let i=0;i<=N;i+=4){const [a,b]=mp(P[i%N].x,P[i%N].z);i?mx.lineTo(a,b):mx.moveTo(a,b);}mx.closePath();
  mx.strokeStyle='#2b1a10';mx.lineWidth=13;mx.stroke();
  const ZC={grass:'#8a8f9c',sand:'#e0b866',mud:'#8a5a30',ice:'#bfe6ff'};mx.lineWidth=8;mx.lineCap='round';
  for(let i=0;i<N;i+=4){const j=(i+4)%N;const [a,b]=mp(P[i].x,P[i].z),[c,d]=mp(P[j].x,P[j].z);mx.strokeStyle=ZC[ZI[i]];mx.beginPath();mx.moveTo(a,b);mx.lineTo(c,d);mx.stroke();}
  const [sx,sz]=mp(P[0].x,P[0].z);mx.fillStyle='#fff';mx.fillRect(sx-5,sz-5,10,10);
  for(const k of karts.slice().sort(a=>a.isPlayer?1:-1)){const [a,b]=mp(k.x,k.z);mx.beginPath();mx.arc(a,b,k.isPlayer?10:7,0,Math.PI*2);mx.fillStyle='#'+k.a.kart.toString(16).padStart(6,'0');mx.fill();mx.lineWidth=3;mx.strokeStyle=k.isPlayer?'#fff':'#2b1a10';mx.stroke();}}
function finishRace(){state='done';toast('抵達終點！');sBeep(660,0.15);setTimeout(()=>sBeep(880,0.3),160);setTimeout(showResults,1800);}
function showResults(){const list=order();const r=list.indexOf(player);
  $('#resList').innerHTML=list.map((k,i)=>`<li class="${k.isPlayer?'me':''}"><b>${i+1}</b><span>${k.a.name}${k.isPlayer?'（你）':''}</span><em>${k.finished?fmt(k.ft):'還在跑…'}</em></li>`).join('');
  $('#resTitle').textContent=r===0?'冠軍！臭氣沖天的勝利':r<3?`第 ${r+1} 名，上台領獎！`:`第 ${r+1} 名，下次多放幾個屁！`;
  $('#res').classList.remove('hidden');$('#tc').classList.add('hidden');}

/* ---------- camera + loop ---------- */
function updCamera(dt){const k=player;if(!k)return;const sx=Math.sin(k.h),cz=Math.cos(k.h),f=1-Math.exp(-dt*5);
  camPos.x+=(k.x-sx*13-camPos.x)*f;camPos.z+=(k.z-cz*13-camPos.z)*f;camPos.y+=(6.5+k.y*0.6-camPos.y)*f;
  camera.position.copy(camPos);if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake*3;camera.position.y+=(Math.random()-.5)*shake*3;}
  camera.lookAt(k.x+sx*8,1.8+k.y*0.5,k.z+cz*8);
  const fov=70+(k.boostT>0?14:0)+Math.max(0,k.speed-40)*0.2;camera.fov+=(fov-camera.fov)*f;camera.updateProjectionMatrix();}
function update(dt){clock+=dt;
  for(const b of boxes){b.m.rotation.y+=dt*1.5;b.m.rotation.x+=dt*0.7;b.m.position.y=1.8+Math.sin(clock*2+b.x)*0.3;if(b.t>0){b.t-=dt;if(b.t<=0)b.m.visible=true;}}
  if(state==='select'){const k=player;if(k){const a=clock*0.45;camera.position.set(k.x+Math.sin(a)*9,4.2,k.z+Math.cos(a)*9);camera.lookAt(k.x,2.2,k.z);
    k.head.rotation.y=Math.sin(clock*2)*0.35;k.model.position.y=Math.abs(Math.sin(clock*3))*0.25;if(camera.fov!==60){camera.fov=60;camera.updateProjectionMatrix();}}return;}
  if(state==='countdown'){countT-=dt;const c=Math.ceil(countT);if(c!==lastCount&&c>0){lastCount=c;showCount(c);sBeep(440,0.2);}
    if(countT<=0){state='race';showCount('出發！');sBeep(880,0.4);}}
  if(state!=='countdown')raceT+=dt;
  const racing=state!=='countdown';
  for(const k of karts)updKart(k,dt,racing);
  collide();updHazards(dt);updParts(dt);order().forEach((k,i)=>k.rank=i);updCamera(dt);hud();}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}

/* ---------- input ---------- */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{const m=KM[e.code];if(m){keys[m]=true;e.preventDefault();}
  if(e.code==='Space'||e.code==='KeyJ'){e.preventDefault();if(state==='race'&&player&&!player.finished)useItem(player);}
  if(e.code==='Enter'&&state==='select')startRace();});
addEventListener('keyup',e=>{const m=KM[e.code];if(m)keys[m]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function hold(id,key){const el=$(id);const on=e=>{e.preventDefault();keys[key]=true;el.classList.add('on');initAudio();},off=e=>{keys[key]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);for(const ev of['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,off);}
hold('#bBrake','down');
/* floating joystick: press anywhere on the track view, drag left/right */
let joySteer=0,joyId=null,joyX=0,joyY=0;const JR=56,JMAX=0.6,joy=$('#joy'),knob=$('#knob');
function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;joySteer=0;joy.classList.remove('on');knob.style.transform='';}
$('#c').addEventListener('pointerdown',e=>{if(state==='select'||joyId!==null)return;e.preventDefault();initAudio();
  joyId=e.pointerId;joyX=e.clientX;joyY=e.clientY;joy.style.left=joyX+'px';joy.style.top=joyY+'px';joy.classList.add('on');knob.style.transform='';
  try{$('#c').setPointerCapture(e.pointerId);}catch(_){}$('#joyHint').classList.add('fade');});
$('#c').addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;e.preventDefault();
  const dx=clamp(e.clientX-joyX,-JR,JR),dy=clamp(e.clientY-joyY,-JR*0.35,JR*0.35);knob.style.transform=`translate(${dx}px,${dy}px)`;
  const u=Math.abs(dx)<6?0:(Math.abs(dx)-6)/(JR-6);joySteer=-Math.sign(dx)*JMAX*Math.min(1,u)**1.6;});
for(const ev of['pointerup','pointercancel','lostpointercapture'])$('#c').addEventListener(ev,joyEnd);
$('#bItem').addEventListener('pointerdown',e=>{e.preventDefault();const el=e.currentTarget;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),120);if(state==='race'&&player&&!player.finished)useItem(player);});
$('#mute').addEventListener('click',()=>{muted=!muted;$('#mute').textContent=muted?'音效 關':'音效 開';});
let startLock=0;function tapStart(e){if(e)e.preventDefault();const n=performance.now();if(n-startLock<600||state!=='select')return;startLock=n;startRace();}
for(const ev of['click','pointerup','touchend'])$('#start').addEventListener(ev,tapStart);
function tapAgain(e){if(e)e.preventDefault();const n=performance.now();if(n-startLock<600)return;startLock=n;startRace();}
for(const ev of['click','pointerup','touchend'])$('#again').addEventListener(ev,tapAgain);
$('#change').addEventListener('click',showSelect);
const hex=c=>'#'+c.toString(16).padStart(6,'0');
function renderCards(){$('#cards').innerHTML=ANIMALS.map((a,i)=>`<button class="card" type="button" data-i="${i}" aria-pressed="${i===selIdx}"><span class="dot" style="background:linear-gradient(${hex(a.color)} 58%,${hex(a.kart)} 58%)"></span>${a.name}</button>`).join('');}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b)return;selIdx=+b.dataset.i;renderCards();buildPreview();sBeep(600,0.06,'triangle',0.2);});
$('#hint').textContent=touchMode?'手機：自動油門，手指按住畫面會出現搖桿，左右拖動轉彎；右下「道具」丟東西、「剎車」減速':'鍵盤：← → 轉彎　↑ 油門　↓ 剎車　空白鍵 使用道具';
if(innerHeight<600)$('#help').open=false;
renderCards();showSelect();requestAnimationFrame(loop);
document.getElementById('err').classList.add('hidden');
}catch(e){window.__fail('遊戲啟動失敗，請截圖給我：'+(e&&e.message));}};
if(window.__threeOK)window.boot();
</script>
</body></html>
